[project]
name = "condux"
version = "0.1.0"
description = "Condux SDK for Python — report errors to Condux."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Condux" }]
keywords = ["error-monitoring", "condux", "sentry", "observability", "crash-reporting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: System :: Monitoring",
]
dependencies = []

[project.urls]
Homepage = "https://condux.ai"
Repository = "https://github.com/tripledownab/condux"
Documentation = "https://github.com/tripledownab/condux/tree/main/sdks/python#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condux"]
