[project]
name = "condux"
version = "0.1.0"
description = "Condux SDK for Python — report errors to Condux."
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
authors = [{ name = "Condux" }]
keywords = ["error-monitoring", "condux", "sentry", "observability", "crash-reporting"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Bug Tracking",
  "Topic :: System :: Monitoring",
]
dependencies = []

# Test only, never installed by a user. The frameworks are here because the adapter tests must run
# against the REAL thing: a fake app that raises assumes the exception escapes, and for a framework that
# handles its own exceptions that assumption is false, so such a test passes while the adapter reports
# nothing.
[project.optional-dependencies]
test = ["flask>=2.3", "django>=4.2", "starlette>=0.37"]

[project.urls]
Homepage = "https://condux.ai"
Repository = "https://github.com/tripledownab/condux"
Documentation = "https://github.com/tripledownab/condux/tree/main/sdks/python#readme"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/condux"]
