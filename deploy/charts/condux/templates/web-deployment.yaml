apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "condux.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "condux.selectorLabels" (dict "Release" .Release "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "condux.selectorLabels" (dict "Release" .Release "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          # The dashboard bakes its API base URL at build (NEXT_PUBLIC_CONDUX_API_URL); build the web
          # image with your domain or serve it same-origin behind the ingress.
          image: {{ include "condux.image" (dict "root" . "name" .Values.image.web) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.web.port }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.web.port }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
