apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-web
  labels:
    {{- include "condux.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      {{- include "condux.selectorLabels" (dict "Release" .Release "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "condux.selectorLabels" (dict "Release" .Release "component" "web") | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          # The dashboard bakes two URLs at build time, so neither can be set here: its API base
          # (NEXT_PUBLIC_CONDUX_API_URL) and the ingest URL it rebuilds a key's DSN from
          # (NEXT_PUBLIC_CONDUX_INGEST_URL, which must match config.ingestHost or the DSN the UI
          # displays points somewhere the server never minted). Build the web image with your domains,
          # or serve the API same-origin behind the ingress.
          image: {{ include "condux.image" (dict "root" . "name" .Values.image.web) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.web.port }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.web.port }}
          livenessProbe:
            tcpSocket:
              port: {{ .Values.web.port }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
