{{- if not .Values.secret.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-condux
  labels:
    {{- include "condux.labels" . | nindent 4 }}
type: Opaque
stringData:
  CONDUX_POSTGRES: {{ .Values.secret.postgresConnectionString | quote }}
  CONDUX_CLICKHOUSE_USER: {{ .Values.secret.clickhouseUser | quote }}
  CONDUX_CLICKHOUSE_PASSWORD: {{ .Values.secret.clickhousePassword | quote }}
  {{- if .Values.secret.secretKey }}
  CONDUX_SECRET_KEY: {{ .Values.secret.secretKey | quote }}
  {{- end }}
  {{- if .Values.secret.anthropicApiKey }}
  CONDUX_ANTHROPIC_API_KEY: {{ .Values.secret.anthropicApiKey | quote }}
  {{- end }}
  {{- if .Values.github.enabled }}
  CONDUX_GITHUB_WEBHOOK_SECRET: {{ .Values.github.webhookSecret | quote }}
  github-app.pem: {{ .Values.github.privateKey | quote }}
  CONDUX_GITHUB_CLIENT_SECRET: {{ required "github.clientSecret is required when github.enabled: the GitHub App's client secret, which the user-authorization leg needs." .Values.github.clientSecret | quote }}
  {{- end }}
  {{- if .Values.linear.enabled }}
  {{- if not .Values.secret.secretKey }}
  {{- fail "linear.enabled needs secret.secretKey: the Linear grant is stored encrypted with it, and the control-plane refuses to start without one." }}
  {{- end }}
  CONDUX_LINEAR_CLIENT_SECRET: {{ required "linear.clientSecret is required when linear.enabled: the Linear OAuth application's client secret." .Values.linear.clientSecret | quote }}
  {{- end }}
  {{- if .Values.objectStore.enabled }}
  CONDUX_S3_ACCESS_KEY: {{ .Values.objectStore.accessKey | quote }}
  CONDUX_S3_SECRET_KEY: {{ .Values.objectStore.secretKey | quote }}
  {{- if .Values.objectStore.readOnlyKey }}
  CONDUX_S3_READ_ACCESS_KEY: {{ required "objectStore.readAccessKey is required when objectStore.readOnlyKey is true: the consumer's read-only key." .Values.objectStore.readAccessKey | quote }}
  CONDUX_S3_READ_SECRET_KEY: {{ required "objectStore.readSecretKey is required when objectStore.readOnlyKey is true: the consumer's read-only key." .Values.objectStore.readSecretKey | quote }}
  {{- end }}
  {{- end }}
  {{- if and .Values.email.enabled .Values.email.password }}
  CONDUX_SMTP_PASSWORD: {{ .Values.email.password | quote }}
  {{- end }}
{{- end }}
