{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-condux
  labels:
    {{- include "condux.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    # The dashboard host serves the control-plane's paths (same-origin) and the dashboard at /. The
    # control-plane's are the same three the Caddyfiles route: the API, its OpenAPI document, and the MCP
    # server card that directories read without a token.
    - host: {{ .Values.ingress.appHost | quote }}
      http:
        paths:
          {{- range list "/api" "/openapi" "/.well-known/mcp" }}
          - path: {{ . }}
            pathType: Prefix
            backend:
              service:
                name: {{ $.Release.Name }}-controlplane
                port:
                  number: {{ $.Values.controlplane.port }}
          {{- end }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-web
                port:
                  number: {{ .Values.web.port }}
    # The ingest host is the relay (SDK /store/ + OTLP /v1/logs). It comes from config.ingestHost, the
    # same value the minted DSNs carry, because an SDK arrives with that host in its request.
    - host: {{ include "condux.ingestHost" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-relay
                port:
                  number: {{ .Values.relay.port }}
{{- end }}
