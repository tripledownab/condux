# Condux Helm values.
#
# This chart deploys the five Condux services (relay, control-plane, consumer, conductor, web). It does
# NOT run the data stores — bring your own managed Postgres, ClickHouse, Kafka/Redpanda and Valkey/Redis
# (recommended for production) and point the chart at them below. Credentials go in a Secret (inline for
# dev, or reference an existing one for production).

image:
  registry: ghcr.io/condux
  tag: latest
  pullPolicy: IfNotPresent
  # Per-service image names under the registry (built from backend/Dockerfile targets + web/Dockerfile;
  # `migrations` is built from deploy/migrations.Dockerfile).
  controlplane: controlplane
  relay: relay
  consumer: consumer
  conductor: conductor
  web: web
  migrations: migrations
imagePullSecrets: []

# Where the external data stores live (non-secret coordinates; credentials are in `secret`).
externalStores:
  clickhouse:
    url: "http://clickhouse:8123"
  kafka:
    bootstrap: "kafka:9092"
  valkey:
    url: "valkey:6379"

# Credentials. For production set `existingSecret` to a Secret you created with these keys
# (CONDUX_POSTGRES, CONDUX_CLICKHOUSE_USER, CONDUX_CLICKHOUSE_PASSWORD, and — if used — CONDUX_SECRET_KEY,
# CONDUX_ANTHROPIC_API_KEY, CONDUX_GITHUB_WEBHOOK_SECRET, CONDUX_GITHUB_CLIENT_SECRET, github-app.pem),
# and leave the inline values empty. For dev you may inline them and the chart creates the Secret.
#
# This list is a copy of what the deployments reference, and nothing compares the two: a key added to a
# deployment and not to this line renders happily and then fails the pod at startup on a missing key.
# When you add one, add it here.
secret:
  existingSecret: ""
  postgresConnectionString: "" # e.g. Host=pg;Username=condux;Password=...;Database=condux;SSL Mode=Require
  clickhouseUser: ""
  clickhousePassword: ""
  secretKey: ""        # base64 AES-256 master key for the BYO-key registry (#65); empty → those routes 404
  anthropicApiKey: ""  # only for conductor.provider=anthropic

# Non-secret app config.
config:
  # The public address of your relay, which the control-plane writes into every DSN it mints, and which
  # the ingress below routes to the relay. REQUIRED: the code falls back to the dev localhost, so
  # leaving this empty ships DSNs no SDK can reach. The dashboard also displays a DSN it rebuilds
  # client-side, from the web image's build arg NEXT_PUBLIC_CONDUX_INGEST_URL, so set that at build too.
  ingestHost: ""            # e.g. ingest.example.com
  ingestScheme: https       # http only for a cluster with no TLS at the edge
  corsOrigins: ""           # leave empty when the dashboard is same-origin (prod); set for split-origin
  platformAdminEmails: ""   # comma-separated allowlist for the /admin console (empty → none)
  # Absolute dashboard URL. It is REQUIRED once ingress.tls is set, and the render fails without it,
  # because the control-plane also reads it to decide whether its session cookie carries Secure: TLS
  # ends at the ingress, so the request reaching the pod is plain http and says nothing about how the
  # browser got there. On a plain-http install it may stay empty, which degrades each mailer
  # differently: the consumer still sends the weekly summary but without its button, while the
  # control-plane skips the invite email entirely. Neither fails a request, and an invite still works,
  # since its accept link is returned to the inviter to pass on.
  appBaseUrl: ""            # e.g. https://app.example.com
  sampleKeepFirst: "50"     # consumer: keep the first N raw events per issue
  sampleEvery: "20"         # then store 1-in-M repeats

# Email (alert rules #56, Conductor-pause org notices #130, invite accept links #84) — opt-in. When
# enabled, the control-plane and consumer deliver via this SMTP relay (the password lives in the Secret).
# Leave disabled to keep email off (Slack + webhook alerts still work). For Resend: host smtp.resend.com,
# port 587, user "resend", password a Resend API key, from an address on the verified domain.
email:
  enabled: false
  host: ""
  port: 587
  ssl: true
  from: "alerts@condux.local"
  user: ""
  password: ""

conductor:
  provider: fake            # fake | simulated-agent | anthropic
  replicas: 1
  resources: {}

# GitHub App (the Conductor) — opt-in. When enabled the private key + webhook secret are stored in the
# Secret and the control-plane's /api/github/* routes + the anthropic provider activate.
#
# clientSecret and oauthRedirectUri are as required as the rest: connecting an org to an installation is
# done through GitHub user authorization, because that is the only way to ask which installations a given
# person can reach. Without them the control-plane refuses to start rather than fall back to trusting an
# installation id from a query string. oauthRedirectUri must equal the App's Callback URL and point at the
# API, e.g. https://app.example.com/api/github/oauth/callback.
github:
  enabled: false
  clientId: ""
  appSlug: ""
  webhookSecret: ""
  privateKey: ""            # the App private key PEM (stored as the Secret key github-app.pem)
  clientSecret: ""
  oauthRedirectUri: ""

# Source-map object store (ADR-0028) — opt-in, BYO S3-compatible bucket. When enabled the control-plane's
# /api/sourcemaps upload routes activate; the access key + secret are stored in the Secret. Leave the
# endpoint empty for AWS S3 (set region), or point it at a non-AWS S3 (MinIO, Cloudflare R2, etc.).
objectStore:
  enabled: false
  endpoint: ""
  bucket: ""
  region: ""
  serverSideEncryption: "" # e.g. AES256 for SSE-S3; empty relies on the bucket's default encryption
  accessKey: ""            # stored in the Secret as CONDUX_S3_ACCESS_KEY
  secretKey: ""            # stored in the Secret as CONDUX_S3_SECRET_KEY

# A pre-install / pre-upgrade hook Job that applies the Postgres + ClickHouse migrations (baked into the
# migrations image from the repo — single-sourced, idempotent). Disable if you apply migrations yourself.
migrations:
  enabled: true

controlplane:
  replicas: 2
  port: 8080
  resources: {}
  autoscaling:
    enabled: false
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70

# The relay is the elastic ingest hot path — autoscale it.
relay:
  replicas: 3
  port: 9000
  resources: {}
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 20
    targetCPUUtilizationPercentage: 65

consumer:
  replicas: 2
  resources: {}
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 12
    targetCPUUtilizationPercentage: 70

web:
  replicas: 2
  port: 3000
  resources: {}
  # The dashboard bakes its API base URL at build time (NEXT_PUBLIC_CONDUX_API_URL). Build the web image
  # with your domain, or serve it same-origin behind the ingress below.

# Ingress: route the dashboard + API host to the web + control-plane, and the ingest host to the relay.
ingress:
  enabled: false
  className: ""
  annotations: {}
  appHost: app.condux.example # dashboard (web) + API (control-plane, under /api)
  # The ingest host is not repeated here. It is `config.ingestHost` above, because the SDK reaches the
  # relay by the host in its DSN, so a second value could only ever disagree with the one that routes.
  # Cover both hosts: this appHost and config.ingestHost above.
  tls: [] # [{ secretName: condux-tls, hosts: [app.condux.example, ingest.example.com] }]
