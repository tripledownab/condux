name: condux

# Production override for running the whole stack on one host.
# Layered on the base file (the base defines the services; this hardens them for prod):
#
#   docker compose --env-file .env.prod -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# What it changes:
#   - Adds Caddy as the ONLY public service: it terminates TLS (automatic Let's Encrypt) and reverse
#     proxies app.condux.ai (dashboard + API, same-origin) and ingest.condux.ai (relay).
#   - restart: unless-stopped on every long-running service.
#   - Control-plane runs in Production, same-origin (no CORS), with the dev admin seed OFF.
#   - The web image calls the API with RELATIVE urls (same-origin through Caddy), so it is host-agnostic.
#   - Redpanda gets a persistent volume (dev leaves the log ephemeral).
#
# NOTE ON PORTS: Compose *concatenates* published ports across files, so it cannot un-publish the base
# datastore ports here. The security boundary is the host firewall — open ONLY 22/80/443 (the runbook
# shows the cloud-firewall / ufw steps). Everything else stays on the private compose network.

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Each binding is a variable for the reason the note above gives: concatenation means a later file
    # can only ADD a published port, never take one away, so a variable in the file that declares the
    # port is the only mechanism that can un-publish it. A second environment sharing a host with
    # something that already owns 80/443 sets these; a deployment that owns the host sets nothing and
    # gets the values that were here before.
    ports:
      - "${EDGE_HTTP_BIND:-80:80}"
      - "${EDGE_HTTPS_BIND:-443:443}"
      - "${EDGE_HTTPS_UDP_BIND:-443:443/udp}"
    volumes:
      # THE DIRECTORY, NOT THE FILE. A single-file bind mount pins to the file's inode, and anything
      # that replaces the file rather than writing through it gives it a new one: a git checkout, an
      # rsync, an editor that writes-and-renames. The container then keeps serving the OLD content
      # while the host shows the new, and a reload reports success having applied nothing. Measured on
      # a running edge: after replacing the file the container's inode was unchanged and it could not
      # see a line that was plainly in the host's copy.
      - ./caddy:/etc/caddy:ro
      - ./.data/caddy/data:/data
      - ./.data/caddy/config:/config
    depends_on: [web, controlplane, relay]

  # MinIO is AGPL and unused by any service today (S3 is BYO). Park it behind a profile so it never starts
  # in prod; nothing depends on it. (Dev, which runs the base file alone, is unaffected.)
  minio:
    profiles: ["dev-object-store"]

  minio-init:
    profiles: ["dev-object-store"]

  # Mailpit is a dev-only SMTP catcher; park it so it never starts in prod (prod email uses a real relay
  # configured in .env.prod). Nothing depends on it.
  mailpit:
    profiles: ["dev-mail"]

  postgres:
    restart: unless-stopped

  clickhouse:
    restart: unless-stopped

  redpanda:
    restart: unless-stopped
    # Persist the Kafka log across restarts (the base runs dev-container mode with an ephemeral store).
    # A NAMED volume, not a bind mount: Redpanda runs as its own uid and can't write a root-owned host
    # dir, whereas a named volume inherits the image's mountpoint ownership. (Postgres/ClickHouse chown
    # their bind-mounted data dirs on startup, so those stay bind mounts for easy backups; Redpanda's log
    # is a rebuildable buffer, not something you back up.)
    volumes: ["redpanda-data:/var/lib/redpanda/data"]

  valkey:
    restart: unless-stopped

  relay:
    restart: unless-stopped # reached via Caddy at ingest.condux.ai

  controlplane:
    restart: unless-stopped # reached via Caddy at app.condux.ai/api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # Same-origin in prod (Caddy serves the dashboard + API on one host), so no CORS is emitted.
      CONDUX_CORS_ORIGINS: ""
      # Absolute base URL for links that leave the browser: invite emails, the SSO redirect URI, and the
      # Stripe checkout/portal return URLs (Stripe rejects a relative URL). Same-origin prod has no CORS
      # origin to fall back to. Overridable via .env.prod; defaults to the public dashboard host.
      CONDUX_APP_BASE_URL: ${CONDUX_APP_BASE_URL:-https://app.condux.ai}
      # DSNs / ingest URLs handed to users must point at the public relay host, not the dev localhost
      # default (Caddy fronts the relay at ingest.condux.ai over TLS).
      #
      # VARIABLES, NOT LITERALS, and this is the one pair in this file where that matters most. These
      # two values are baked into every DSN the control-plane mints. As literals, a second environment
      # layered on this overlay would hand out DSNs naming the production relay, so anything wired to
      # that environment would report into production, attributed to a release production never ran.
      # Nothing downstream could tell those events apart from real ones.
      CONDUX_INGEST_SCHEME: ${CONDUX_INGEST_SCHEME:-https}
      CONDUX_INGEST_HOST: ${CONDUX_INGEST_HOST:-ingest.condux.ai}
      # Never seed a dev admin in production.
      CONDUX_SEED_ADMIN_EMAIL: ""
      CONDUX_SEED_ADMIN_PASSWORD: ""
      # The base defaults SMTP to the dev-only Mailpit; clear the host so prod email stays opt-in. Set
      # CONDUX_SMTP_HOST (+ port/ssl/from/user/password) in .env.prod to a real relay to enable email.
      CONDUX_SMTP_HOST: ${CONDUX_SMTP_HOST:-}
      # The base points the source-map object store at the dev MinIO; prod uses a BYO S3 bucket. Off (the
      # /api/sourcemaps routes 404) until set in .env.prod: a real bucket + access key + secret (endpoint
      # for a non-AWS S3, region for AWS).
      CONDUX_S3_ENDPOINT: ${CONDUX_S3_ENDPOINT:-}
      CONDUX_S3_BUCKET: ${CONDUX_S3_BUCKET:-}
      CONDUX_S3_ACCESS_KEY: ${CONDUX_S3_ACCESS_KEY:-}
      CONDUX_S3_SECRET_KEY: ${CONDUX_S3_SECRET_KEY:-}
      CONDUX_S3_REGION: ${CONDUX_S3_REGION:-}
      # Optional at-rest encryption for uploaded maps (e.g. AES256 for SSE-S3); unset relies on the
      # bucket's default encryption (AWS S3 encrypts new objects by default).
      CONDUX_S3_SSE: ${CONDUX_S3_SSE:-}

  web:
    restart: unless-stopped # reached via Caddy at app.condux.ai
    build:
      args:
        # Empty => the dashboard talks to the API with relative URLs, i.e. same-origin through Caddy.
        # Keeps the image domain-agnostic (no rebuild per host) and keeps the session cookie first-party.
        NEXT_PUBLIC_CONDUX_API_URL: ""
        # The DSN shown in the dashboard must point SDKs at the public relay (Caddy fronts it over TLS),
        # not the dev localhost fallback, so a copied DSN actually reaches ingest.
        #
        # BUILT FROM THE SAME TWO VARIABLES the control-plane mints DSNs from, rather than repeating
        # the host. This is the DSN a human copies out of the dashboard, so it has to name the relay
        # the server-side one names; a third value here could disagree with them, and the way anyone
        # would find out is a copied DSN quietly reporting somewhere else.
        NEXT_PUBLIC_CONDUX_INGEST_URL: ${CONDUX_INGEST_SCHEME:-https}://${CONDUX_INGEST_HOST:-ingest.condux.ai}
        # Client-side self-reporting (#75): same key as CONDUX_WEB_DSN but with the public ingest host
        # (events tunnel through /monitoring; the DSN's key is public by design). Optional.
        NEXT_PUBLIC_CONDUX_DSN: ${CONDUX_WEB_PUBLIC_DSN:-}
        # The signup acceptance notice links the published terms + privacy policy on the marketing site.
        # This is the hosted service, so there ARE terms to accept and clause 1 of them says signing up
        # accepts them. Unset would silently hide the notice and leave that clause resting on nothing.
        NEXT_PUBLIC_CONDUX_LEGAL_URL: "https://condux.ai"
        # Source-map upload (ADR-0028, Condux on Condux): the deploy's commit sha is the release the
        # dashboard reports AND the release its maps upload under — one value, derived from the checkout
        # by deploy-app.yml, so the two cannot disagree. The upload goes through the public app URL.
        NEXT_PUBLIC_CONDUX_RELEASE: ${CONDUX_COMMIT:-}
        # The upload target is this deployment's own dashboard, which the overlay already names once
        # above, so read that rather than repeat it. A literal here would make a non-production build
        # offer its maps to production, which answers 401 and leaves the maps unuploaded. The upload
        # strips a trailing slash from this value, so the two spellings cannot diverge in behaviour,
        # pinned by sdks/nextjs/test/sourcemaps.test.ts.
        CONDUX_URL: ${CONDUX_APP_BASE_URL:-https://app.condux.ai}
      secrets: [condux_release_token]
    environment:
      # The server half of the dashboard reports the same release as the baked client one above.
      CONDUX_RELEASE: ${CONDUX_COMMIT:-}

  consumer:
    restart: unless-stopped
    environment:
      # As with the control-plane: don't inherit the dev Mailpit default; email is opt-in via .env.prod.
      CONDUX_SMTP_HOST: ${CONDUX_SMTP_HOST:-}
      # The weekly summary worker runs here (ADR-0031); its digest CTA links to the public dashboard, same
      # absolute URL the control-plane uses (the dev base default in docker-compose.yml points at localhost).
      CONDUX_APP_BASE_URL: ${CONDUX_APP_BASE_URL:-https://app.condux.ai}

  conductor:
    restart: unless-stopped

volumes:
  redpanda-data:

secrets:
  # The scoped release token the web image build uploads source maps with (ADR-0028). A BuildKit secret
  # rather than a build arg so it never lands in the image history. Sourced from .env.prod, which MUST
  # define the key (an empty value is fine and means stamp-only) — compose refuses to start when an
  # environment-sourced secret's variable is missing entirely.
  condux_release_token:
    environment: CONDUX_RELEASE_TOKEN
