name: condux-staging

# What belongs here: the differences between a deployment that owns its host and a staging deployment
# that shares one. Layered ON TOP of the production overlay rather than instead of it, so staging
# rehearses production's wiring instead of a second arrangement of it:
#
#   docker compose --env-file .env.staging \
#     -f docker-compose.yml -f docker-compose.prod.yml -f docker-compose.staging.yml \
#     --profile dev-mail up -d --build
#
# Four differences, each one forced by sharing a host:
#   - The edge binds an address and ports the host's other occupants do not already own. The
#     production file declares its bindings as variables, so .env.staging sets those; this file only
#     ADDS the relay's own edge port, which is the one thing port concatenation is good for.
#   - TLS is served from a certificate file. A private address cannot answer an ACME challenge, so
#     something outside this stack issues the certificate and something outside this stack renews it.
#   - Every long-running service gets a memory limit, because on a shared host none of them can have
#     the whole machine. The deploy refuses a render in which one has none.
#   - The bundled mail catcher comes back, so staging cannot mail a real person by accident. The
#     production overlay parks it behind the dev-mail profile, which the command line above re-enables.
#
# The project name differs from the production overlay's, so a stack brought up from these files can
# never adopt, recreate or tear down containers belonging to one brought up from those.
#
# Every value this file needs is REQUIRED with no default. A staging deployment that silently fell
# back to a production default is the failure this whole file exists to prevent, so an absent value
# stops the render rather than picking something.

services:
  caddy:
    # The edge config reads this to decide which name each site answers to. Caddy reads it from its own
    # process environment, so it has to be passed in here: nothing else in the stack gives the edge its
    # hostname, and the production overlay has no need to, because production writes its names into the
    # config file directly.
    #
    # REQUIRED, and enforced HERE rather than in the config file, because the config file cannot
    # enforce it. Measured on the image this runs: with the value absent, the site addresses collapse
    # from "name:443" to ":443" and Caddy calls that a valid configuration, because a bare port is a
    # legitimate catch-all. So the edge would come up answering to any name at all, and the deploy
    # would go green. Compose refusing to render is the only place the absence is visible.
    environment:
      CONDUX_STAGING_HOST: ${CONDUX_STAGING_HOST:?set CONDUX_STAGING_HOST to the name on the certificate}
    volumes:
      # REPLACES the production edge config. Compose merges volumes by container path and the last
      # file to name one wins, so this target has to stay spelled exactly as the production file
      # spells it. A DIRECTORY for the reason the production file gives: a single-file bind pins to an
      # inode, and a deploy replaces the file rather than writing through it, so the reload this
      # deploy runs would report success and apply nothing.
      - ./caddy-staging:/etc/caddy:ro
      # MOUNT THE ISSUING DIRECTORY, NEVER A COPY. Whatever renews a shared certificate finds the
      # containers that must re-read it by looking for the ones mounting the path it writes to, so a
      # copy is renewed on disk and never re-read here. Nothing fails on the day that is set up: the
      # symptom is this edge serving an expired certificate once the current one runs out.
      - ${STAGING_TLS_DIR:?set STAGING_TLS_DIR to the host directory the shared certificate is issued into}:/etc/condux/tls:ro
    ports:
      # ADDITIVE, and that is the point: concatenation cannot take the production file's bindings away
      # but it can add this one. Production fronts the relay on a hostname of its own; a host with one
      # name has one certificate, so staging tells the dashboard and the relay apart by port instead.
      - "${EDGE_INGEST_BIND:?set EDGE_INGEST_BIND to the address and port SDKs reach the relay on}"
    # REPLACES the production edge's ceiling, which is sized for public traffic. This edge is reached
    # only over a private network, so most of that ceiling would be memory taken from the host's other
    # stack for connections that cannot arrive.
    deploy: { resources: { limits: { memory: 128m } } }
    memswap_limit: 128m

  mailpit:
    # The catcher is already what every staging service sends to. This publishes its INBOX, which is a
    # separate question: the base file binds it to loopback, so reading what staging sent means opening
    # a tunnel first, and a staging stack whose mail nobody reads is a staging stack whose invite and
    # alert paths are never actually checked.
    #
    # ADDITIVE, like the relay's edge port above. The loopback binding the base file declares stays and
    # costs nothing. It is NOT behind the edge: the inbox holds staging's own mail on a private network,
    # so it needs no certificate, and putting it there would mean a third site block for something no
    # SDK and no browser session depends on.
    ports:
      - "${MAILPIT_BIND:?set MAILPIT_BIND to the address and port the staging inbox is read on}"
    # The base file starts it once and never again, which is right for a laptop and wrong here: after a
    # host restart it would be the one long-running service left down, and staging's mail would go
    # nowhere until someone noticed.
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 128m } } }
    memswap_limit: 128m

  clickhouse:
    # A shared host cannot give ClickHouse the whole machine, and an uncapped one will eventually take
    # it. The ceiling lives in .env.staging rather than here: it is a property of the host this happens
    # to run on, which a file in the repository has no way to know and no business stating.
    #
    # A CONTAINER LIMIT IS ENOUGH, and that was measured rather than assumed. ClickHouse reads the
    # cgroup limit and sets its own server memory budget to a fraction of it, so it refuses a query
    # that would exceed the ceiling instead of being killed at it. Without that, a limit here would
    # only change which process the kernel kills, which is not the same thing as a cap.
    deploy:
      resources:
        limits:
          memory: ${CLICKHOUSE_MEMORY_LIMIT:?set CLICKHOUSE_MEMORY_LIMIT to the ceiling ClickHouse may use}
    memswap_limit: ${CLICKHOUSE_MEMORY_LIMIT}

  redpanda:
    # A LIMIT ALONE IS NOT ENOUGH HERE, unlike ClickHouse above. Dev-container mode passes
    # --reserve-memory=0M and no --memory, so Seastar budgets everything it can see: the whole host with
    # no limit, and the whole limit with one. Measured on this image: under a 1 GiB limit its budget was
    # 1,004 MB, leaving nothing for what Seastar does not allocate, so it would be killed at its own
    # ceiling. With no limit it grows into the host's memory until the kernel kills it, and the restart
    # policy starts it again into the same shortage, for as long as the shortage lasts. --memory sets
    # the budget outright (measured: 512 MiB, and 300 MB of writes left it at 154 MiB resident), and
    # the limit sits above it for the rest.
    #
    # THIS RESTATES THE BASE FILE'S COMMAND, because Compose replaces a command whole and cannot append
    # to one. The deploy compares the two and refuses a render where they differ by anything but the
    # flag added here, so a change to the base command cannot leave staging running the old one.
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --default-log-level=warn
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
      - --memory=512M
    deploy: { resources: { limits: { memory: 768m } } }
    memswap_limit: 768m

  # The rest are sized well above what each used at the time of writing, so a limit bounds a fault
  # rather than normal load. The .NET services size their garbage collector to the limit. The
  # control-plane and the consumer each hold up to two whole debug files at once, which is why they get
  # the most. The symbolizer keeps the base file's limit: it is sized for the parser, not for staging.
  #
  # EVERY memswap_limit EQUALS ITS LIMIT, so no container here may swap. On a host with swap, Docker
  # otherwise lets each container swap as much again as its limit, and one at its ceiling then pages
  # against the shared disk instead of being killed, which slows the disk for everything on the host.
  # Host swap still serves the host's own processes and any container that is allowed to swap. The
  # deploy checks both values.
  web:
    deploy: { resources: { limits: { memory: 384m } } }
    memswap_limit: 384m
  relay:
    deploy: { resources: { limits: { memory: 384m } } }
    memswap_limit: 384m
  controlplane:
    deploy: { resources: { limits: { memory: 768m } } }
    memswap_limit: 768m
  consumer:
    deploy: { resources: { limits: { memory: 512m } } }
    memswap_limit: 512m
  conductor:
    deploy: { resources: { limits: { memory: 384m } } }
    memswap_limit: 384m
  postgres:
    deploy: { resources: { limits: { memory: 384m } } }
    memswap_limit: 384m
  valkey:
    deploy: { resources: { limits: { memory: 64m } } }
    memswap_limit: 64m
  symbolizer:
    memswap_limit: 1G
