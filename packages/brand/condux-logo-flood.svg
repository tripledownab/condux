46%,72.67%{stroke-dashoffset:0;fill-opacity:0;stroke-opacity:1}
78.17%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:1}
83.17%,100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0}}
@keyframes cxIn6{
0%{stroke-dashoffset:1;fill-opacity:0;stroke-opacity:1}
