<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 144.1 37.9" class="cx" role="img" aria-label="Condux"><style>.cx{--t:calc(1.4s * var(--speed, 1));--w:.75}
.cx path{fill:currentColor;stroke:currentColor;stroke-width:var(--w);
stroke-linecap:butt;stroke-linejoin:round;stroke-dasharray:1 1;fill-opacity:0}
/* Fill/stroke are currentColor, so the wordmark inherits the surrounding text color and themes itself.
   Runs once (forwards) and holds the fully filled mark: no fade-out, so it settles as a static logo. */
.cx .g0 path{animation:cxIn0 var(--t) cubic-bezier(.45,.05,.3,1) forwards}
.cx .g1 path{animation:cxIn1 var(--t) cubic-bezier(.45,.05,.3,1) forwards}
.cx .g2 path{animation:cxIn2 var(--t) cubic-bezier(.45,.05,.3,1) forwards}
.cx .g3 path{animation:cxIn3 var(--t) cubic-bezier(.45,.05,.3,1) forwards}
.cx .g4 path{animation:cxIn4 var(--t) cubic-bezier(.45,.05,.3,1) forwards}
.cx .g5 path{animation:cxIn5 var(--t) cubic-bezier(.45,.05,.3,1) forwards}
.cx .g6 path{animation:cxIn6 var(--t) cubic-bezier(.45,.05,.3,1) forwards}
@keyframes cxIn0{
0%{stroke-dashoffset:1;fill-opacity:0;stroke-opacity:1}
46%{stroke-dashoffset:0;fill-opacity:0;stroke-opacity:1}
51.5%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:1}
56.5%,100%{stroke-dashoffset:0;fill-opacity:1;stroke-opacity:0}}
