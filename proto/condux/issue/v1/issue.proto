syntax = "proto3";

package condux.issue.v1;

option go_package = "github.com/condux/condux/gen/go/condux/issue/v1;issuev1";

import "condux/ingest/v1/event.proto";

enum IssueStatus {
  ISSUE_STATUS_UNSPECIFIED = 0;
  ISSUE_STATUS_UNRESOLVED = 1;
  ISSUE_STATUS_RESOLVED = 2;
  ISSUE_STATUS_IGNORED = 3;
}

// A group of events that share a fingerprint — the unit users triage.
message Issue {
  string id = 1;
  string project_id = 2;
  string fingerprint = 3; // server-computed grouping hash
  string title = 4;
  string culprit = 5;
  condux.ingest.v1.Level level = 6;
  IssueStatus status = 7;
  int64 first_seen_unix_ms = 8;
  int64 last_seen_unix_ms = 9;
  uint64 event_count = 10;
  uint64 user_count = 11;
}
